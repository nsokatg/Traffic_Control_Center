<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GitHub Traffic Control Center</title>
<style>
body{background:#0d1117;color:#c9d1d9;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;margin:0;padding:24px}
h1{font-size:1.4rem;color:#58a6ff;margin-bottom:16px}
.panel{background:#161b22;border:1px solid #30363d;border-radius:6px;padding:16px;margin-bottom:20px}
.group{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
input[type=password]{background:#0d1117;border:1px solid #30363d;color:#c9d1d9;padding:8px 12px;border-radius:6px;font-size:.9rem;flex:1;min-width:200px}
.btn{background:#238636;border:1px solid rgba(240,246,252,.1);color:#fff;padding:8px 16px;border-radius:6px;font-size:.9rem;cursor:pointer;font-weight:bold;white-space:nowrap}
.btn:hover:not(:disabled){background:#2ea043}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-sub{background:#9e6a03}.btn-sub:hover:not(:disabled){background:#bb8009}
.btn-clear{background:#da3633}.btn-clear:hover:not(:disabled){background:#b62324}
.table-container{overflow-x:auto;border:1px solid #30363d;border-radius:6px}
table{width:100%;border-collapse:collapse;background:#161b22;text-align:left;font-size:.9rem}
th,td{padding:12px 16px;border-bottom:1px solid #21262d;vertical-align:middle}
th{color:#8b949e;font-weight:600}
tr:hover{background:#1c2128}
.badge{display:inline-block;padding:2px 8px;border-radius:12px;font-size:.8rem;font-weight:bold;background:#30363d}
.status-loading{background:#9e6a03;color:#fff}
.status-success{background:#1f6beb;color:#fff}
.status-error{background:#da3633;color:#fff}
.num{font-weight:bold;color:#3fb950}
.note{font-size:.8rem;color:#8b949e;margin-top:8px}
.err-detail{display:block;font-size:.75rem;color:#f85149;margin-top:4px;max-width:360px;white-space:normal}
#summary{margin:0 0 12px;font-size:.9rem;color:#8b949e}
a{color:#58a6ff;text-decoration:none}
</style>
</head>
<body>

<h1>🚀 複数リポジトリ トラフィック巡回管制室</h1>

<div class="panel">
  <div class="group">
    <label for="pat" style="font-size:.9rem">Personal Access Token (PAT):</label>
    <input type="password" id="pat" autocomplete="off" placeholder="github_pat_xxx または ghp_xxx を入力">
    <button class="btn" id="runBtn" onclick="saveAndFetch()">保存して巡回実行</button>
    <button class="btn btn-sub" id="retryBtn" onclick="retryFailed()" disabled>失敗分のみ再試行</button>
    <button class="btn btn-clear" onclick="clearToken()">保存クリア</button>
  </div>
  <div class="note">
    ※ トークンはこのブラウザのローカルストレージに保存されます（暗号化はされません）。他の人が使うPCでは使わず、読み取り専用の最小権限のトークンをご利用ください。
  </div>
</div>

<div id="summary"></div>

<div class="table-container">
  <table>
    <thead>
      <tr>
        <th style="width:25%">リポジトリ名</th>
        <th style="width:15%">過去14日間のVisitors (UV)</th>
        <th style="width:15%">過去14日間のViews (PV)</th>
        <th style="width:30%">取得ステータス</th>
        <th style="width:15%">リンク</th>
      </tr>
    </thead>
    <tbody id="traffic-table-body"></tbody>
  </table>
</div>

<script>
const targetRepos = [
  { owner: 'nsokatg', name: 'bookmark', label: 'Bookmark 共有' },
  { owner: 'nsokatg', name: 'FMS', label: 'FMS' },
  { owner: 'nsokatg', name: 'myportal', label: 'Myportal (メイン)' },
  { owner: 'nsokatg', name: 'Self-talk-notes', label: 'Self-talk-notes' },
  { owner: 'nsokatg', name: 'CloseupToday', label: 'CloseupToday' },
  { owner: 'nsokatg', name: 'knowledge_store', label: 'knowledge_store' },
  { owner: 'nsokatg', name: 'Prompt_Maker', label: 'Prompt_Maker' },
  { owner: 'nsokatg', name: 'my-calender-app', label: 'my-calender-app' },
  { owner: 'nsokatg', name: 'Household_accounts', label: 'Household_accounts' },
  { owner: 'nsokatg', name: 'RssNews', label: 'RssNews' },
  { owner: 'nsokatg', name: 'Diary_Recorder', label: 'Diary_Recorder' },
  { owner: 'nsokatg', name: 'Web_Memo', label: 'Web_Memo' },
  { owner: 'nsokatg', name: 'Personal_research_learning_note', label: 'Personal_research_learning_note' },
  { owner: 'nsokatg', name: 'Personal_Learning_Hub', label: 'Personal Learning Hub' },
  { owner: 'nsokatg', name: 'payroll', label: 'payroll' },
  { owner: 'nsokatg', name: 'GlyphAI', label: 'GlyphAI' },
  { owner: 'nsokatg', name: 'ai-photo-browser', label: 'ai-photo-browser' },
  { owner: 'nsokatg', name: 'Smart_Buyer', label: 'Smart_Buyer' },
  { owner: 'nsokatg', name: 'Traffic_Control_Center', label: 'Traffic_Control_Center' },
  { owner: 'nsokatg', name: 'Bizportal', label: 'Bizportal' },
  { owner: 'nsokatg', name: 'Tana-Snap', label: 'Tana-Snap' }
];

const CONCURRENCY = 4;          // 同時に取得する数
let results = [];               // { ok, uv, pv, error }
let running = false;

const $ = id => document.getElementById(id);

function initTable() {
  const tbody = $('traffic-table-body');
  tbody.innerHTML = '';
  results = targetRepos.map(() => null);
  targetRepos.forEach((repo, i) => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td style="font-weight:bold">${repo.label}<br><small style="color:#8b949e">${repo.owner}/${repo.name}</small></td>
      <td id="uv-${i}">-</td>
      <td id="pv-${i}">-</td>
      <td><span class="badge" id="status-${i}">未実行</span><span class="err-detail" id="detail-${i}"></span></td>
      <td><a href="https://github.com/${repo.owner}/${repo.name}/graphs/traffic" target="_blank" rel="noopener">Trafficを開く</a></td>`;
    tbody.appendChild(tr);
  });
}

// エラーの原因をわかりやすい日本語にする
function explain(status, apiMessage, rateLimited) {
  if (rateLimited) return 'APIの利用回数制限です。しばらく待ってから再試行してください。';
  if (status === 401) return 'トークンが無効、または期限切れです。';
  if (status === 403) return '権限不足です。Trafficの閲覧にはリポジトリへのpush権限が必要です。細粒度トークンは「Administration: Read」権限を付けてください。';
  if (status === 404) return 'リポジトリが見つからない、またはトークンの対象外です。リポジトリ名の綴り、非公開設定、細粒度トークンの「対象リポジトリ」を確認してください。';
  return `HTTPエラー ${status}` + (apiMessage ? `（${apiMessage}）` : '');
}

async function fetchOne(i, token) {
  const repo = targetRepos[i];
  const statusEl = $(`status-${i}`), detailEl = $(`detail-${i}`);
  statusEl.className = 'badge status-loading';
  statusEl.textContent = '取得中...';
  detailEl.textContent = '';

  try {
    const res = await fetch(`https://api.github.com/repos/${repo.owner}/${repo.name}/traffic/views`, {
      headers: {
        'Authorization': `Bearer ${token}`,
        'Accept': 'application/vnd.github+json',
        'X-GitHub-Api-Version': '2022-11-28'
      }
    });

    if (!res.ok) {
      let apiMessage = '';
      try { apiMessage = (await res.json()).message || ''; } catch (e) {}
      const rateLimited = res.headers.get('x-ratelimit-remaining') === '0' || res.status === 429;
      throw new Error(`${res.status}|${apiMessage}|${rateLimited}`);
    }

    const data = await res.json();
    $(`uv-${i}`).innerHTML = `<span class="num">${data.uniques}</span> 名`;
    $(`pv-${i}`).textContent = `${data.count} 回`;
    statusEl.className = 'badge status-success';
    statusEl.textContent = '完了';
    results[i] = { ok: true, uv: data.uniques, pv: data.count };
  } catch (err) {
    let msg;
    if (err instanceof TypeError) {
      msg = 'ネットワークエラーです。接続を確認してください。';
    } else {
      const [status, apiMessage, rate] = String(err.message).split('|');
      msg = explain(Number(status), apiMessage, rate === 'true');
    }
    console.error(repo.name, err);
    $(`uv-${i}`).textContent = '-';
    $(`pv-${i}`).textContent = '-';
    statusEl.className = 'badge status-error';
    statusEl.textContent = '失敗';
    detailEl.textContent = msg;
    results[i] = { ok: false, error: msg };
  }
}

// 指定したリポジトリを、同時数を制限して取得する
async function runIndices(indices) {
  const token = $('pat').value.trim();
  if (!token) { alert('Personal Access Token (PAT) を入力してください。'); return; }
  if (running) return;

  running = true;
  $('runBtn').disabled = true;
  $('retryBtn').disabled = true;

  let next = 0;
  const worker = async () => {
    while (next < indices.length) await fetchOne(indices[next++], token);
  };
  await Promise.all(Array.from({ length: Math.min(CONCURRENCY, indices.length) }, worker));

  running = false;
  $('runBtn').disabled = false;
  updateSummary();
}

function updateSummary() {
  const done = results.filter(r => r && r.ok);
  const failed = results.filter(r => r && !r.ok).length;
  const pv = done.reduce((s, r) => s + r.pv, 0);
  $('summary').textContent = `成功 ${done.length}件 / 失敗 ${failed}件 / 合計PV ${pv}回`;
  $('retryBtn').disabled = failed === 0;
}

function saveAndFetch() {
  const token = $('pat').value.trim();
  if (!token) { alert('Personal Access Token (PAT) を入力してください。'); return; }
  try { localStorage.setItem('github_traffic_pat', token); } catch (e) {}
  runIndices(targetRepos.map((_, i) => i));
}

function retryFailed() {
  const idx = results.map((r, i) => (r && !r.ok) ? i : -1).filter(i => i >= 0);
  if (idx.length) runIndices(idx);
}

function clearToken() {
  try { localStorage.removeItem('github_traffic_pat'); } catch (e) {}
  $('pat').value = '';
  alert('保存されたトークンをクリアしました。');
}

window.onload = function () {
  initTable();
  let saved = null;
  try { saved = localStorage.getItem('github_traffic_pat'); } catch (e) {}
  if (saved) {
    $('pat').value = saved;
    runIndices(targetRepos.map((_, i) => i));
  }
};
</script>
</body>
</html>
