<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>GitHub Traffic Control Center</title>
    <style>
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 24px;
        }
        h1 {
            font-size: 1.4rem;
            color: #58a6ff;
            margin-bottom: 16px;
        }
        .config-panel {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 16px;
            margin-bottom: 20px;
        }
        .input-group {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        input[type="text"], input[type="password"] {
            background-color: #0d1117;
            border: 1px solid #30363d;
            color: #c9d1d9;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.9rem;
            flex: 1;
        }
        .btn {
            background-color: #238636;
            border: 1px solid rgba(240,246,252,0.1);
            color: #ffffff;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 0.9rem;
            cursor: pointer;
            font-weight: bold;
            white-space: nowrap;
        }
        .btn:hover {
            background-color: #2ea043;
        }
        .btn-clear {
            background-color: #da3633;
        }
        .btn-clear:hover {
            background-color: #b62324;
        }
        .table-container {
            overflow-x: auto;
            border: 1px solid #30363d;
            border-radius: 6px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background-color: #161b22;
            text-align: left;
            font-size: 0.9rem;
        }
        th, td {
            padding: 12px 16px;
            border-bottom: 1px solid #21262d;
            vertical-align: middle;
        }
        th {
            background-color: #161b22;
            color: #8b949e;
            font-weight: 600;
        }
        tr:hover {
            background-color: #1c2128;
        }
        .badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: bold;
        }
        .status-loading { background-color: #9e6a03; color: #fff; }
        .status-success { background-color: #1f6beb; color: #fff; }
        .status-error { background-color: #da3633; color: #fff; }
        .num-highlight {
            font-weight: bold;
            color: #3fb950;
        }
        .note {
            font-size: 0.8rem;
            color: #8b949e;
            margin-top: 8px;
        }
    </style>
</head>
<body>

    <h1>🚀 複数リポジトリ トラフィック巡回管制室</h1>

    <div class="config-panel">
        <div class="input-group">
            <label for="pat" style="font-size:0.9rem;">Personal Access Token (PAT):</label>
            <input type="password" id="pat" placeholder="github_pat_xxx または ghp_xxx を入力">
            <button class="btn" onclick="saveAndFetch()">保存して巡回実行</button>
            <button class="btn btn-clear" onclick="clearToken()">保存クリア</button>
        </div>
        <div class="note">
            ※ 入力したトークンはブラウザのローカルストレージに安全に保存され、次回から自動で読み込まれます（他人にこのPCを使われない環境でご利用ください）。
        </div>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th style="width: 25%;">リポジトリ名</th>
                    <th style="width: 20%;">過去14日間のVisitors (UV)</th>
                    <th style="width: 20%;">過去14日間のViews (PV)</th>
                    <th style="width: 15%;">取得ステータス</th>
                    <th style="width: 20%;">リンク</th>
                </tr>
            </thead>
            <tbody id="traffic-table-body">
                <!-- JavaScriptでここにデータが挿入されます -->
            </tbody>
        </table>
    </div>

    <script>
        // 巡回したいリポジトリのリスト（ユーザー名 / リポジトリ名）
        const targetRepos = [
            { owner: 'nsokatg', name: 'bookmark', label: 'Bookmark 共有' },
            { owner: 'nsokatg', name: 'FMS', label: 'FMS' },
            { owner: 'nsokatg', name: 'myportal', label: 'Myportal (メイン)' },
            { owner: 'nsokatg', name: 'Self-talk-notes', label: 'Self-talk-notes' },
            { owner: 'nsokatg', name: 'CloseupToday', label: 'CloseupToday' },
            { owner: 'nsokatg', name: 'knowledge_store', label: 'knowledge_store' },
            { owner: 'nsokatg', name: 'Prompt_Maker', label: 'Prompt_Maker' },
            { owner: 'nsokatg', name: 'my-calender-app', label: 'my-calender-app' },
            { owner: 'nsokatg', name: 'Household_accounts', label: 'Household_accounts' },
            { owner: 'nsokatg', name: 'RssNews', label: 'RssNews' },
            { owner: 'nsokatg', name: 'Diary_Recorder', label: 'Diary_Recorder' },
            { owner: 'nsokatg', name: 'Web_Memo', label: 'Web_Memo' },
            { owner: 'nsokatg', name: 'Personal_research_learning_note', label: 'Personal_research_learning_note' },
            { owner: 'nsokatg', name: 'Personal_Learning_Hub', label: 'Personal Learning Hub' },
            { owner: 'nsokatg', name: 'payroll', label: 'payroll' },
            { owner: 'nsokatg', name: 'GlyphAI', label: 'GlyphAI' },
            { owner: 'nsokatg', name: 'ai-photo-browser', label: 'ai-photo-browser' },
            { owner: 'nsokatg', name: 'Smart_Buyer', label: 'Smart_Buyer' },
            { owner: 'nsokatg', name: 'Traffic_Control_Center', label: 'Traffic_Control_Center' }, 
            { owner: 'nsokatg', name: 'Bizportal', label: 'Bizportal' },
            { owner: 'nsokatg', name: 'Tana-Snap', label: 'Tana-Snap' }
        ];

        // 初期表示（表の骨組みを生成）
        function initTable() {
            const tbody = document.getElementById('traffic-table-body');
            tbody.innerHTML = '';
            
            targetRepos.forEach((repo, index) => {
                const tr = document.createElement('tr');
                tr.id = `repo-row-${index}`;
                // リンク先を正しい /graphs/traffic に修正
                tr.innerHTML = `
                    <td style="font-weight:bold;">${repo.label} <br><small style="color:#8b949e;">${repo.owner}/${repo.name}</small></td>
                    <td id="uv-${index}">-</td>
                    <td id="pv-${index}">-</td>
                    <td><span class="badge" id="status-${index}" style="background-color:#30363d;">未実行</span></td>
                    <td>
                        <a href="https://github.com/${repo.owner}/${repo.name}/graphs/traffic" target="_blank" style="color:#58a6ff; text-decoration:none;">Trafficを開く</a>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        // トークンを保存して巡回を実行する関数
        function saveAndFetch() {
            const token = document.getElementById('pat').value.trim();
            if (!token) {
                alert('Personal Access Token (PAT) を入力してください。');
                return;
            }
            // ローカルストレージに保存
            localStorage.setItem('github_traffic_pat', token);
            fetchTrafficData();
        }

        // 保存されたトークンを削除する関数
        function clearToken() {
            localStorage.removeItem('github_traffic_pat');
            document.getElementById('pat').value = '';
            alert('保存されたトークンをクリアしました。');
        }

        // 各リポジトリを自動巡回してAPIからデータを取得する関数
        async function fetchTrafficData() {
            const token = document.getElementById('pat').value.trim();
            if (!token) {
                alert('Personal Access Token (PAT) が入力されていません。');
                return;
            }

            for (let i = 0; i < targetRepos.length; i++) {
                const repo = targetRepos[i];
                const statusEl = document.getElementById(`status-${i}`);
                const uvEl = document.getElementById(`uv-${i}`);
                const pvEl = document.getElementById(`pv-${i}`);

                // ステータスを「取得中」にする
                statusEl.className = 'badge status-loading';
                statusEl.textContent = '取得中...';

                try {
                    const response = await fetch(`https://api.github.com/repos/${repo.owner}/${repo.name}/traffic/views`, {
                        headers: {
                            'Authorization': `token ${token}`,
                            'Accept': 'application/vnd.github.v3+json'
                        }
                    });

                    if (!response.ok) {
                        throw new Error(`エラー: ${response.status}`);
                    }

                    const data = await response.json();
                    
                    // 取得成功したら表の数値を書き換え
                    uvEl.innerHTML = `<span class="num-highlight">${data.uniques}</span> 名`;
                    pvEl.textContent = `${data.count} 回`;
                    
                    statusEl.className = 'badge status-success';
                    statusEl.textContent = '完了';

                } catch (error) {
                    console.error(error);
                    uvEl.textContent = 'エラー';
                    pvEl.textContent = 'エラー';
                    statusEl.className = 'badge status-error';
                    statusEl.textContent = '失敗';
                }
            }
        }

        // ページロード時の処理
        window.onload = function() {
            initTable();
            // ローカルストレージからトークンを自動復元
            const savedToken = localStorage.getItem('github_traffic_pat');
            if (savedToken) {
                document.getElementById('pat').value = savedToken;
                // トークンが保存されていれば自動で巡回を開始する
                fetchTrafficData();
            }
        };
    </script>
</body>
</html>
